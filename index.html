    <script>

        console.log("Value is: " + value);

        const rssUrl =
            "https://www.rssrssrssrss.com/api/merge?feeds=" +

        const proxyUrl =
            "https://corsproxy.io/?key=" +
            value +
            "&url=" +
            encodeURIComponent(rssUrl);

        fetch(proxyUrl)
            .then((response) => response.text())
            .then((xmlString) => {
                const parser = new DOMParser();

                return parser.parseFromString(xmlString, "text/xml");
            })
            .then((xmlDocument) => extractFeedItems(xmlDocument))
            .then((feedItems) => displayFeedItems(feedItems));

        /**
         * Extracts feed items from the parsed XML document.
         */
        function extractFeedItems(xmlDocument) {
            const items = xmlDocument.getElementsByTagName("item");
            const feedItems = [];
            const seenAuthors = new Set();

            for (let i = 0; i < items.length; i++) {
                const titleElement =
                    items[i].getElementsByTagName("title")[0];

                const linkElement =
                    items[i].getElementsByTagName("link")[0];

                const pubDateElement =
                    items[i].getElementsByTagName("pubDate")[0];

                const authorElement =
                    items[i].getElementsByTagName("source")[0];

                const title = titleElement?.textContent ?? "";

                const link = (linkElement?.textContent ?? "").replace(
                    /([^:]\/)\/+/g,
                    "$1"
                );

                const pubDate = formatPubDate(
                    pubDateElement?.textContent ?? ""
                );

                const author = authorElement?.textContent.trim() ?? "";
console.log((i+1) + ' - ' + author + ' - ' + pubDate);

        if (seenAuthors.has(author)) {
            continue;
        }

//console.log((i+1) + ' - ' + author + ' - ' + pubDate);

        seenAuthors.add(author);

                feedItems.push({
                    title,
                    link,
                    pubDate,
                    author
                });
            }

            return feedItems;
        }

        /**
         * Displays the feed items on the page.
         */
        function displayFeedItems(feedItems) {
            const container = document.getElementById("feed-container");

            container.innerHTML = feedItems
                .map(
                    (item) => `
                        <div class="feed-item">
                            <p>${item.pubDate}</p>

                            <h3>
                                <a
                                    href="${item.link}"
                                    rel="noopener noreferrer"
                                >
                                    ${item.title}
                                </a>
                            </h3>

                            <p>${item.author}</p>
                        </div>
                    `
                )
                .join("");
        }

        /**
         * Formats publication dates consistently.
         */
        function formatPubDate(dateString) {
            if (!dateString) {
                return "";
            }

            const date = new Date(dateString);

            if (Number.isNaN(date.getTime())) {
                return dateString;
            }

            return new Intl.DateTimeFormat("sv-SE", {
                year: "numeric",
                month: "long",
                day: "numeric",
                //hour: "2-digit",
                //minute: "2-digit"
            }).format(date);
        }
    </script>
